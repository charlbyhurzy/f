name: Android release APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android NDK and CMake
        # Versions match engine/build.gradle.kts (NDK 26.3.11579264) and
        # engine/CMakeLists.txt (CMake 3.22.1). The runner already has the SDK.
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Restore release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          # Written to app/ because app/build.gradle.kts resolves storeFile
          # relative to the app module. Both paths are git-ignored.
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/keystore.properties

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: futura-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove local signing files
        if: always()
        run: rm -f app/release.keystore app/keystore.properties
