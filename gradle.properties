#
# Project-wide Gradle tuning for the Futura Audio multi-module build.
# JVM heap, parallelism, caching, AndroidX/Kotlin flags, and Kotlin DSL
# compiler settings. Module-specific options live in each module's
# build.gradle.kts.

# ── Gradle Daemon JVM ─────────────────────────────────────────────────────
# Large native + ML project: 4 GB heap keeps KSP, Hilt, and the Kotlin
# compiler from GC-thrashing on cold builds.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ── Build Performance ─────────────────────────────────────────────────────
# Parallel module execution (app + engine build independently).
org.gradle.parallel=true
# Reuse task outputs across clean builds.
org.gradle.caching=true
# Configuration cache speeds up repeated invocations; disabled only if a
# plugin breaks it. Re-enable via CLI flag when needed: --no-configuration-cache
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# File-system watching for incremental compilation.
org.gradle.vfs.watch=true

# ── AndroidX & Jetifier ───────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=false
# Non-transitive R classes reduce APK size and module coupling.
android.nonTransitiveRClass=true
# Enable per-module resource namespacing.
android.nonFinalResIds=true
# Pre-dexing / build cache for AARs.
android.enableR8.fullMode=true

# ── Kotlin ────────────────────────────────────────────────────────────────
kotlin.code.style=official
# Incremental compilation for Kotlin.
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
# Use the parallel Kotlin compiler frontend.
kotlin.compiler.execution.strategy=in-process

# ── KSP (Room / Hilt / Moshi) ─────────────────────────────────────────────
# Keep generated Kotlin/Java sources visible for IDE navigation.
ksp.incremental=true
ksp.useKSP2=false

# ── Compose ───────────────────────────────────────────────────────────────
# Compose Compiler is provided by the Kotlin 2.0 plugin; these flags tune
# the runtime and Android Studio previews.
android.experimental.enableScreenshotTest=true

# ── Native C++ Build (:engine) ────────────────────────────────────────────
# CMake arguments are declared in engine/build.gradle.kts; keep the build
# directory in a predictable location for CI caching.
android.native.buildOutput=verbose

# ── Miscellaneous ─────────────────────────────────────────────────────────
# Suppress the "Configuration cache is an incubating feature" notice.
org.gradle.warning.mode=summary
# Deterministic build timestamps.
org.gradle.daemon=true
